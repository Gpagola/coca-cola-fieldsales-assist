name: Deploy Distribuidora Pampa (SMART-assistB2B)

on:
  push:
    branches: [demo-distribuidora-pampa]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar frontend
        working-directory: frontend
        env:
          VITE_API_URL: /SMART-assistB2B/pampa/api
        run: |
          npm install
          npm run build -- --mode production

      - name: Subir archivos al servidor
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude='.venv' --exclude='node_modules' --exclude='__pycache__' --exclude='.git' --exclude='*.pyc' --exclude='.env' --exclude='.github' --exclude='attachments/'
          path: ./
          remote_path: /opt/smart-assistb2b-pampa/
          remote_user: debian
          remote_host: sb0.braintrust-cs.com
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Reinstalar dependencias y reiniciar servicio
        uses: appleboy/ssh-action@v1
        with:
          host: sb0.braintrust-cs.com
          username: debian
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/smart-assistb2b-pampa/.venv/bin/pip install -q -r /opt/smart-assistb2b-pampa/requirements.txt
            sudo systemctl restart smart-assistb2b-pampa

      # nginx NO se toca en el pipeline: es compartido por todas las apps del
      # servidor. Los bloques de /SMART-assistB2B/pampa/ se agregan manualmente
      # una sola vez (paso deliberado y separado).
