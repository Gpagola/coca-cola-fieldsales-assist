name: Deploy Coca-Cola Field Sales

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar frontend
        working-directory: frontend
        env:
          VITE_API_URL: /SMART-assistB2B/cocacola/api
        run: |
          npm install
          npm run build -- --mode production

      - name: Subir archivos al servidor
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude='.venv' --exclude='node_modules' --exclude='__pycache__' --exclude='.git' --exclude='*.pyc' --exclude='.env' --exclude='.github' --exclude='attachments/'
          path: ./
          remote_path: /opt/smart-cocacola/
          remote_user: debian
          remote_host: sb0.braintrust-cs.com
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Reinstalar dependencias y reiniciar servicio
        uses: appleboy/ssh-action@v1
        with:
          host: sb0.braintrust-cs.com
          username: debian
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/smart-cocacola/.venv/bin/pip install -q -r /opt/smart-cocacola/requirements.txt
            sudo systemctl restart smart-cocacola

      # Deliberadamente NO se toca nginx en este pipeline: el archivo de nginx
      # es compartido por todas las apps del servidor (smartassist, smartretain,
      # smartquote, MinorRM, siae, crm-brain, Personae, n8n). Regenerarlo o
      # copiarlo automaticamente en cada commit arriesgaria romper el ruteo de
      # las demas. El bloque de /SMART-Cocacola/ ya esta agregado manualmente
      # una sola vez; si hiciera falta tocarlo de nuevo, es un paso manual
      # deliberado y separado.
